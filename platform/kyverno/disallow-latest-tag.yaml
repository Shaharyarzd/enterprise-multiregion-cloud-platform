apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-versioned-image
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaceSelector:
                matchLabels:
                  policy.careflow.io/require-digest: "true"
      validate:
        message: "Mutable :latest images are not allowed."
        pattern:
          spec:
            containers:
              - image: "!*:latest"
