apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: careflow-observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: careflow-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.5.4
      helm:
        valueFiles:
          - $values/platform/observability/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/REPLACE_ME/enterprise-multiregion-cloud-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
