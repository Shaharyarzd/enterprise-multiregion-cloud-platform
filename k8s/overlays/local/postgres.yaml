apiVersion: v1
kind: Service
metadata:
  name: careflow-postgres
  namespace: careflow
  labels:
    app.kubernetes.io/name: careflow-postgres
spec:
  selector:
    app.kubernetes.io/name: careflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: careflow-postgres
  namespace: careflow
spec:
  serviceName: careflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: careflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: careflow-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:17.6-alpine3.22
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: careflow
            - name: POSTGRES_USER
              value: careflow_local
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: careflow-db-credentials
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "careflow_local", "-d", "careflow"]
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
