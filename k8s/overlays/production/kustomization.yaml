apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secret.yaml
  - ingress.yaml
  - security-group-policy.yaml
  - servicemonitor.yaml
  - prometheus-rule.yaml

images:
  - name: careflow-api
    newName: careflow-api
    digest: sha256:c6627ddbc70e7a928f41fad30208922cca3563efd94b2a5a1d80a9b6fa6904ba

patches:
  - target:
      kind: ConfigMap
      name: careflow-api-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: production
      - op: replace
        path: /data/APP_VERSION
        value: 0.2.0-readiness-failure
      - op: add
        path: /data/FORCE_READINESS_FAILURE
        value: "true"
  - target:
      kind: Namespace
      name: careflow
    patch: |-
      - op: add
        path: /metadata/labels/policy.careflow.io~1require-digest
        value: "true"
  - target:
      kind: ServiceAccount
      name: careflow-api
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/REPLACE_ME-careflow-secrets
  - target:
      kind: NetworkPolicy
      name: careflow-api-allow
    patch: |-
      - op: add
        path: /spec/ingress/-
        value:
          from:
            - ipBlock:
                cidr: 10.20.0.0/16
          ports:
            - protocol: TCP
              port: 8080
      - op: add
        path: /spec/egress/-
        value:
          to:
            - ipBlock:
                cidr: 10.20.20.0/22
          ports:
            - protocol: TCP
              port: 5432
