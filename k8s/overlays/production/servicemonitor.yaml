apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: careflow-api
  namespace: careflow
  labels:
    observability.careflow.io/scope: workload
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: careflow-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 5s
