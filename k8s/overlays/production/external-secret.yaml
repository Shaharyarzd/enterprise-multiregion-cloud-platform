apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: careflow-aws-secrets
  namespace: careflow
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: careflow-api
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: careflow-database
  namespace: careflow
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: careflow-aws-secrets
  target:
    name: careflow-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        database.json: '{{ . | toJson }}'
  dataFrom:
    - extract:
        key: REPLACE_ME_RDS_MANAGED_SECRET_ARN
