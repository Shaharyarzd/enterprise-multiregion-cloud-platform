name: Terraform Plan (Manual)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to validate
        required: true
        type: choice
        options: [primary, dr]

permissions:
  contents: read

jobs:
  validate-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  # Real cloud planning should use GitHub OIDC + a read/plan role in a sandbox AWS account.
  # This workflow intentionally has no cloud credentials and NEVER applies infrastructure.
