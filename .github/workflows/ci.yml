name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
      - run: make verify
      - run: make test
      - run: make check-shell

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [primary, dr]
    defaults:
      run:
        working-directory: infra/environments/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.15.9'
      - run: terraform fmt -check -recursive ../../
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate

  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: 'v1.36.2'
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize k8s/overlays/local > /tmp/careflow-local.yaml
          kubectl kustomize k8s/overlays/production > /tmp/careflow-production.yaml
          kubectl kustomize platform/argocd > /tmp/careflow-platform.yaml
      - name: Install kubeconform v0.8.0
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output /tmp/kubeconform.tar.gz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tar.gz' | sha256sum --check
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
      - name: Validate Kubernetes schemas
        run: |
          /tmp/kubeconform -strict -summary -kubernetes-version 1.36.0 /tmp/careflow-local.yaml
          /tmp/kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.36.0 /tmp/careflow-production.yaml
          /tmp/kubeconform -strict -ignore-missing-schemas -summary -kubernetes-version 1.36.0 /tmp/careflow-platform.yaml
